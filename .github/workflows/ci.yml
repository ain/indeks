name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, clippy and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      # `build.rs` generates an RSA key, and the build-script profile is
      # optimised for it, so a cold cache costs a few minutes of compiling.
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Nothing here reaches the internet: tests use --dry-run, fail during
      # validation, or point the endpoint overrides at a local mock server.
      - name: Test
        run: cargo test

  deny:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    env:
      # Pinned so the cache key means something and upgrades are a visible edit.
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # `cargo install` rather than the cargo-deny action, to keep third-party
      # actions out of the workflow. Only the binary is cached: caching the whole
      # of ~/.cargo alongside it buys little here and takes far longer to restore.
      #
      # No restore-keys: a cache from a different version would be worse than a
      # miss, since the install step below skips an existing binary.
      - name: Cache cargo-deny
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      # `cargo install` fails with "binary `cargo-deny` already exists in
      # destination" when the cache has already restored it, so only install on a
      # cache miss. The exact-match key guarantees a restored binary is the
      # pinned version.
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo deny --version

      # Licences, RUSTSEC advisories, wildcard versions and dependency sources.
      # Policy and its reasoning live in deny.toml.
      - name: Check dependencies
        run: cargo deny check

  msrv:
    name: Build on the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cargo.toml claims `rust-version = "1.88"`, and README repeats it. This
      # job is what makes that claim true rather than aspirational.
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-cargo-

      # Checking rather than testing: the claim is about the crate compiling on
      # the version it promises. Behaviour is covered by the job above, and
      # running the suite twice buys nothing. `--all-targets` includes the test
      # targets, so dev-dependencies are held to the same bar.
      - name: Check
        run: cargo check --all-targets --locked
